<!-- Estilos inspirados en Odoo: tarjetas limpias con borde de acento lateral -->
<style>
    .odoo-app-card {
        background-color: #ffffff;
        border: 1px solid #e2e8f0 !important;
        border-left: 4px solid #660033 !important;
        /* Acento lateral característico de Odoo */
        transition: all 0.2s ease-in-out;
    }

    .odoo-app-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 .5rem 1rem rgba(102, 0, 51, 0.08) !important;
        border-color: #cbd5e1 !important;
        border-left-color: #ff9800 !important;
        /* Cambia a naranja al hacer hover */
    }

    .odoo-icon-box {
        width: 48px;
        height: 48px;
        background-color: rgba(102, 0, 51, 0.06);
        color: #660033;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        transition: all 0.2s ease;
    }

    .odoo-app-card:hover .odoo-icon-box {
        background-color: rgba(255, 152, 0, 0.12);
        color: #ff9800;
    }
</style>
