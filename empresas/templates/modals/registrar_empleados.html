<!-- Modal registrar empleado -->
<div class="modal fade" id="modalEmpleado" tabindex="-1" aria-labelledby="tituloModalEmpleado" aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">

            <div class="modal-header text-white" style="background-color: #660033;">
                <div>
                    <h5 class="modal-title" id="tituloModalEmpleado">
                        <i class="bi bi-person-plus me-2"></i>
                        Registrar empleado
                    </h5>
                    <small>Registra un nuevo colaborador de tu empresa</small>
                </div>

                <button type="button" class="btn-close btn-close-white"
                        data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>

            <div class="modal-body p-4">

                <form action="" method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="nombre_empleado" class="form-label">Nombre del empleado</label>
                        <input type="text" name="nombre_empleado" id="nombre_empleado"
                               class="form-control" placeholder="Ingrese el nombre completo" required>
                    </div>

                    <div class="mb-3">
                        <label for="correo" class="form-label">Correo electrónico</label>
                        <input type="email" name="correo" id="correo"
                               class="form-control" placeholder="ejemplo@correo.com" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" name="password" id="password"
                               class="form-control" placeholder="Ingrese una contraseña" required>
                    </div>

                    <div class="mb-3">
                        <label for="cargo" class="form-label">Cargo</label>
                        <input type="text" name="cargo" id="cargo"
                               class="form-control" placeholder="Ej. Farmacéutico, Cajero..." required>
                    </div>

                    <div class="mb-4">
                        <label for="sucursal" class="form-label">Sucursal asignada</label>

                        <select name="sucursal" id="sucursal" class="form-select" required>
                            <option value="">Seleccione una sucursal</option>

                            {% for sucursal in sucursales %}
                                <option value="{{ sucursal.id }}">
                                    {{ sucursal.nombre_sucursal }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <button type="button" class="btn btn-outline-secondary"
                                data-bs-dismiss="modal">
                            Cancelar
                        </button>

                        <button type="submit" class="btn text-white"
                                style="background-color: #660033;">
                            <i class="bi bi-person-check me-1"></i>
                            Registrar empleado
                        </button>
                    </div>

                </form>

            </div>
        </div>
    </div>
</div>
