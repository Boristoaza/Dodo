{% extends 'master.html' %}

{% block title %}
Registro de clientes | Dodo ERP
{% endblock %}

{% block content %}

<div class="container-fluid py-4">

    <!-- CABECERA -->
    <div class="dodo-page-header">
        <div class="dodo-page-header-left">
            <div>
                <h4 class="dodo-page-title">Registro de clientes</h4>
                <p class="dodo-page-subtitle">
                    Administración / Clientes / Nuevo cliente
                </p>
            </div>
        </div>

        <span class="dodo-badge">
            NUEVO REGISTRO
        </span>
    </div>

    <form action="{% url 'administracion:crear_cliente' %}" method="post">
        {% csrf_token %}

        <!-- 01. INFORMACIÓN DEL USUARIO -->
        <div class="dodo-panel mb-4">

            <div class="p-3 border-bottom">
                <h6 class="mb-0 fw-semibold">
                    01. Información del usuario
                </h6>
            </div>

            <div class="p-4">
                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">Nombre de usuario</label>
                        <input type="text" name="username" class="form-control" placeholder="Nombre de usuario">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Correo electrónico</label>
                        <input type="email" name="correo_usuario" class="form-control" placeholder="Correo del usuario">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Nombres</label>
                        <input type="text" name="nombre" class="form-control" placeholder="Nombres">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Apellidos</label>
                        <input type="text" name="apellidos" class="form-control" placeholder="Apellidos">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Contraseña</label>
                        <input type="password" name="contrasenia" class="form-control" placeholder="Contraseña">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Rol del usuario</label>
                        <select name="rol" class="form-select">
                            <option value="">Seleccione un rol</option>
                            <option value="SUP">Superusuario</option>
                            <option value="ADM">Administrador de empresa</option>
                            <option value="EMP">Empleado</option>
                        </select>
                    </div>

                </div>
            </div>
        </div>

        <!-- 02. INFORMACIÓN DE LA EMPRESA -->
        <div class="dodo-panel mb-4">

            <div class="p-3 border-bottom">
                <h6 class="mb-0 fw-semibold">
                    02. Información de la empresa
                </h6>
            </div>

            <div class="p-4">
                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">Nombre de la empresa</label>
                        <input type="text" name="nombre_empresa" class="form-control"
                            placeholder="Nombre de la empresa">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">RUC</label>
                        <input type="text" name="ruc" class="form-control" placeholder="Número de RUC">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Correo empresarial</label>
                        <input type="email" name="correo_empresa" class="form-control"
                            placeholder="Correo de la empresa">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Teléfono</label>
                        <input type="text" name="telefono_empresa" class="form-control"
                            placeholder="Teléfono empresarial">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Ciudad</label>
                        <input type="text" name="ciudad" class="form-control" placeholder="Ciudad">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Dirección</label>
                        <input type="text" name="direccion" class="form-control" placeholder="Dirección">
                    </div>

                    <div class="col-12">
                        <label class="form-label">Actividad económica</label>
                        <input type="text" name="actividad" class="form-control" placeholder="Actividad de la empresa">
                    </div>

                </div>
            </div>
        </div>

        <!-- ACCIONES -->
        <div class="d-flex justify-content-end gap-2 mb-4">

            <button type="reset" class="dodo-btn-secondary">
                Limpiar
            </button>

            <button type="submit" class="dodo-btn-primary">
                Crear cliente
            </button>

        </div>

    </form>

</div>

{% endblock %}
